<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel | Mr Black</title>
  <meta name="theme-color" content="#0D0D0D">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/main.css?v=20261107b">
</head>
<body>
  <a class="skip-link" href="#content">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar-head">
        <a class="brand" href="/index.html" aria-label="Mr Black, vista pública">
          <span class="brand-mark">MB</span>
          <span><span class="brand-name">MR BLACK</span><br><span class="brand-sub">PANEL PRIVADO</span></span>
        </a>
        <button type="button" class="icon-btn menu-btn" id="sidebar-close" aria-label="Cerrar menú"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sidebar-user" id="sidebar-user"></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <button type="button" class="nav-link btn-block" id="logout-btn" style="background:none;border:0;width:100%">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <div class="flex items-center gap-3" style="min-width:0">
          <button type="button" class="icon-btn menu-btn" id="sidebar-open" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
          <div style="min-width:0"><div class="topbar-kicker">PANEL</div><h1 class="topbar-title" id="page-title">Cargando…</h1></div>
        </div>
        <div class="flex items-center gap-2">
          <div class="notif-wrap">
            <button type="button" class="icon-btn" id="notif-btn" aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false">
              <i class="fa-regular fa-bell"></i><span class="notif-dot" id="notif-count" hidden>0</span>
            </button>
            <div class="panel popover" id="notif-pop" hidden></div>
          </div>
          <a href="/index.html" class="btn btn-dark btn-sm"><i class="fa-solid fa-store" aria-hidden="true"></i><span class="hide-sm"> Vista pública</span></a>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app/main.js"></script>
</body>
</html>
