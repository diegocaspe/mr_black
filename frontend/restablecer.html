<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nueva contraseña | Mr Black</title>
  <meta name="theme-color" content="#0D0D0D">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/main.css?v=20261107b">
</head>
<body>
  <main class="auth-split" id="main">
    <aside class="auth-visual v-recover" aria-hidden="true">
      <span class="brand-mark">MB</span>
      <div class="auth-quote">
        <p>Un nuevo<br><em>comienzo.</em></p>
        <p>Crea una contraseña segura para volver a reservar tus citas.</p>
      </div>
    </aside>
    <section class="auth-panel">
      <div class="panel auth-card">
        <a class="brand" href="/index.html" aria-label="Mr Black, ir al inicio">
          <span class="brand-mark">MB</span>
          <span><span class="brand-name">MR BLACK</span><br><span class="brand-sub">BARBER SHOP</span></span>
        </a>
        <div class="mt-8">
          <div class="eyebrow">Recuperación</div>
          <h1>Crea una nueva contraseña</h1>
        </div>
        <div id="reset-invalid" class="form-alert err mt-6" role="alert" hidden>
          <i class="fa-solid fa-link-slash" aria-hidden="true"></i>
          <div>El enlace de recuperación no es válido o ya expiró. <a href="/recuperar.html">Solicita uno nuevo</a>.</div>
        </div>
        <form id="reset-form" class="mt-6 grid" novalidate hidden>
          <div class="field">
            <label for="password">Nueva contraseña <span class="req" aria-hidden="true">*</span></label>
            <div class="input-group">
              <input id="password" name="password" type="password" class="input" autocomplete="new-password" maxlength="128" required>
              <button type="button" class="icon-btn" data-toggle-password="password" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="strength" id="strength" data-score="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <p class="field-hint" id="strength-label" aria-live="polite">Mínimo 8 caracteres con letras y números.</p>
          </div>
          <div class="field">
            <label for="password_confirm">Confirmar contraseña <span class="req" aria-hidden="true">*</span></label>
            <input id="password_confirm" name="password_confirm" type="password" class="input" autocomplete="new-password" maxlength="128" required>
          </div>
          <button type="submit" class="btn btn-gold btn-block"><i class="fa-solid fa-key" aria-hidden="true"></i> Guardar contraseña</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
